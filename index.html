<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#180f25"><meta name="apple-mobile-web-app-capable" content="yes"><title>SO Aim Assistant</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><div class="eyebrow">SHOT ONLINE</div><h1>SO Aim Assistant</h1></div><button id="install" class="install" hidden>Install</button></header><section class="inputs"><label>TARGET DISTANCE<input id="distance" type="text" inputmode="decimal" value="500" aria-label="Target distance"></label><label>WIND M/S ×10<input id="wind" type="text" inputmode="decimal" value="10" aria-label="Wind speed times ten"></label><label>ELEVATION M<div class="elev"><input id="elevation" type="text" inputmode="decimal" value="0" aria-label="Elevation magnitude"><button class="sign active" data-sign="+" aria-label="Uphill">+</button><button class="sign" data-sign="-" aria-label="Downhill">−</button></div></label></section><section><h2>WEATHER</h2><div class="weather buttons"><button class="selected" data-weather="sun">Sun</button><button data-weather="cloud">Cloud +7%</button><button data-weather="rain">Rain +14%</button></div></section><section><h2>TEMPERATURE</h2><div class="temp"><button class="selected" data-mode="default">Default</button><button data-mode="bianca">Bianca</button><select id="temperature" aria-label="Temperature"><option>25°C</option></select></div></section><section class="compass-card"><h2>WIND DIRECTION</h2><div class="compass-wrap"><div class="target">TARGET</div><svg id="compass" viewBox="0 0 320 320" role="img" aria-label="Wind direction selector"><circle cx="160" cy="160" r="132" fill="none" stroke="#725587" stroke-width="2.5"/><line x1="160" y1="160" x2="160" y2="292" stroke="#4e3b61" stroke-width="1.5"/><g id="ticks"></g><g id="pointer" transform="rotate(0 160 160)"><path d="M160 58 L160 162" stroke="#f4c448" stroke-width="12" stroke-linecap="round"/><path d="M160 36 L142 66 L154 62 L166 62 L178 66 Z" fill="#f4c448"/></g><circle cx="160" cy="160" r="119" fill="transparent" id="compass-hit"/></svg><div class="player">PLAYER</div><div id="direction-name" class="direction-name">N · Tailwind</div></div><div class="slider-head"><span>TRUE WIND ANGLE</span><strong id="angle-label">0°</strong></div><input id="angle" type="range" min="0" max="359" step="1" value="0"></section><section class="results"><table><thead><tr><th>CLUB</th><th>PLAY</th><th>ROLL</th><th>AIM</th></tr></thead><tbody id="results"></tbody></table></section><p class="note">Manual calculation preview. The original PC calculation formulas weren't available, so results are estimates, not verified Shot Online values.</p></main><script src="script.js"></script></body></html>
